  <script>
    const adLayer=document.getElementById('adLayer');
    const fakeClose=document.getElementById('fakeClose');
    const realClose=document.getElementById('realClose');
    const feedback=document.getElementById('feedback');
    let feedbackTimer;
    fakeClose.addEventListener('click',()=>{clearTimeout(feedbackTimer);fakeClose.classList.remove('pressed');void fakeClose.offsetWidth;fakeClose.classList.add('pressed');feedback.classList.add('visible');feedbackTimer=setTimeout(()=>{fakeClose.classList.remove('pressed');feedback.classList.remove('visible')},700)});
